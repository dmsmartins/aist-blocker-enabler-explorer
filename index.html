<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>AI Scalability Explorer</title>
  <style>
:root {
  --navy: #102a43;
  --navy-2: #173f5f;
  --ink: #172b3a;
  --muted: #64748b;
  --line: #dde6ee;
  --line-2: #edf2f6;
  --surface: #ffffff;
  --surface-soft: #f7fafc;
  --blue: #1479d2;
  --blue-soft: #eaf4ff;
  --shadow: 0 10px 35px rgba(16, 42, 67, .08);
  --frame: #1f7ae0;
  --commit: #7b3fe4;
  --equip: #2e9f66;
  --assure: #eb7f35;
  --operate: #d84b55;
  --learn: #d6a600;
  --radius-lg: 22px;
  --radius: 15px;
  --radius-sm: 10px;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background: #f8fafc;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; }
button { color: inherit; }
.svg-sprite { position: absolute; overflow: hidden; }

.topbar {
  height: 68px;
  background: var(--navy);
  color: white;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 20px;
  padding: 0 30px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: 0 4px 22px rgba(15, 42, 67, .16);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 0;
  color: white;
  background: none;
  font-weight: 700;
  cursor: pointer;
  justify-self: start;
}
.brand-mark {
  width: 28px;
  height: 28px;
  position: relative;
  display: inline-block;
  flex: 0 0 auto;
  background: url("assets/ai-scalability-logo.svg") center/contain no-repeat;
}
.brand-mark span { display:none; }
.main-nav { display: flex; height: 100%; align-items: stretch; gap: 8px; }
.main-nav button, .main-nav .timeline-nav-link {
  border: 0;
  background: none;
  color: rgba(255,255,255,.78);
  padding: 0 15px;
  cursor: pointer;
  position: relative;
  display: flex;
  align-items: center;
  text-decoration: none;
}
.main-nav button:hover, .main-nav button.active, .main-nav .timeline-nav-link:hover { color: white; }
.main-nav .timeline-nav-link.nav-timeline-pill {
  align-self: center;
  height: 38px;
  margin-right: 6px;
  padding: 0 18px;
  border-radius: 20px;
  background: rgba(255,255,255,.14);
  font-weight: 750;
  color: white;
}
.main-nav .timeline-nav-link.nav-timeline-pill:hover { background: rgba(255,255,255,.22); }
.main-nav .timeline-nav-link.nav-timeline-pill::after { content: none; }
.main-nav button.active::after, .main-nav .timeline-nav-link.active::after {
  content: "";
  position: absolute;
  height: 3px;
  left: 15px;
  right: 15px;
  bottom: 0;
  background: #45a3ff;
  border-radius: 3px 3px 0 0;
}
.topbar-actions { justify-self: end; display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: rgba(255,255,255,.9);
  cursor: pointer;
  position: relative;
  display: grid;
  place-items: center;
}
.icon-btn:hover { background: rgba(255,255,255,.09); }
.icon-btn svg { width: 20px; height: 20px; }
.count-dot {
  position: absolute;
  right: 2px;
  top: 2px;
  min-width: 17px;
  height: 17px;
  padding: 0 4px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: #43a0f5;
  color: white;
  font-size: 10px;
  font-weight: 800;
  border: 2px solid var(--navy);
}

#app { min-height: calc(100vh - 68px); }
.page {
  width: min(1180px, calc(100% - 42px));
  margin: 0 auto;
  padding: 54px 0 80px;
}
.page.narrow { width: min(920px, calc(100% - 42px)); }
.eyebrow {
  margin: 0 0 10px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .17em;
  font-weight: 800;
  color: var(--blue);
}
h1, h2, h3, p { margin-top: 0; }
h1 { font-size: clamp(36px, 5vw, 62px); line-height: .98; letter-spacing: -.045em; color: #102a43; }
h2 { font-size: clamp(30px, 3vw, 42px); line-height: 1.08; letter-spacing: -.03em; color: #102a43; }
h3 { font-size: 18px; color: #17334c; }
.lead { font-size: 18px; line-height: 1.62; color: #486174; max-width: 680px; }
.subtle { color: var(--muted); line-height: 1.55; }

.hero {
  margin-top: -54px;
  padding-top: 70px;
  padding-bottom: 56px;
  min-height: 470px;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(circle at 78% 24%, rgba(69,163,255,.16), transparent 24%),
    radial-gradient(circle at 64% 55%, rgba(46,159,102,.10), transparent 24%),
    linear-gradient(135deg, #fafdff 0%, #f4f8fb 58%, #edf5fb 100%);
  border-radius: 0 0 32px 32px;
}
.hero::after {
  content: "";
  position: absolute;
  width: 720px;
  height: 260px;
  right: -80px;
  top: 90px;
  border: 2px solid rgba(20,121,210,.16);
  border-left-color: transparent;
  border-bottom-color: transparent;
  border-radius: 50%;
  transform: rotate(-8deg);
}
.hero-inner { width: min(1180px, calc(100% - 42px)); margin: 0 auto; position: relative; z-index: 1; }
.hero-copy { max-width: 640px; }
.hero h1 { max-width: 610px; margin-bottom: 22px; }
.home-cards {
  width: min(1180px, calc(100% - 42px));
  margin: -92px auto 0;
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.entry-card, .domain-card, .path-card {
  border: 1px solid var(--line);
  background: rgba(255,255,255,.98);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(16,42,67,.04);
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
}
.entry-card {
  min-height: 210px;
  padding: 26px;
  text-align: left;
  cursor: pointer;
  display: flex;
  flex-direction: column;
}
.entry-card:hover, .domain-card:hover, .path-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
  border-color: #c9d9e7;
}
.entry-icon, .domain-icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--blue-soft);
  color: var(--blue);
  display: grid;
  place-items: center;
  font-weight: 800;
  margin-bottom: 22px;
}
.entry-card p { color: var(--muted); line-height: 1.5; margin-bottom: 20px; }
.card-link { margin-top: auto; color: var(--blue); font-weight: 750; font-size: 14px; }
.framework-strip {
  width: min(1180px, calc(100% - 42px));
  margin: 34px auto 70px;
  padding: 22px 4px;
}
.framework-title { font-size: 12px; font-weight: 750; color: #60748a; margin-bottom: 14px; }
.mechanism-row { display: flex; flex-wrap: wrap; gap: 10px 18px; }
.mechanism-mini { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 720; color: #42596d; }
.mechanism-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--mech); }

.mechanism-explainer-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0,1fr));
  gap: 10px;
}
.mechanism-explainer {
  --mech: var(--blue);
  border: 1px solid var(--line);
  background: rgba(255,255,255,.88);
  border-radius: 12px;
  padding: 12px 13px;
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 3px 9px;
  align-items: start;
}
.mechanism-explainer .mechanism-dot { margin-top: 4px; }
.mechanism-explainer strong {
  color: #29475e;
  font-size: 12px;
  line-height: 1.2;
}
.mechanism-explainer small {
  grid-column: 2;
  color: #718595;
  font-size: 10.5px;
  line-height: 1.35;
}


.hero-grid { display: grid; grid-template-columns: minmax(0,440px) minmax(0,1fr); align-items: center; gap: 40px; }
.hero-actions { display: flex; align-items: center; gap: 22px; margin-top: 30px; flex-wrap: wrap; }
.hero-cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--navy);
  color: #fff;
  text-decoration: none;
  padding: 15px 24px;
  border-radius: 14px;
  font-weight: 750;
  font-size: 15px;
  box-shadow: 0 14px 30px rgba(16,42,67,.22);
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.hero-cta:hover { background: var(--navy-2); transform: translateY(-2px); box-shadow: 0 18px 36px rgba(16,42,67,.28); }
.hero-cta-arrow { display: inline-block; transition: transform .18s ease; }
.hero-cta:hover .hero-cta-arrow { transform: translateX(3px); }
.hero-secondary {
  border: 0;
  background: none;
  color: var(--muted);
  font-weight: 650;
  font-size: 14px;
  cursor: pointer;
  padding: 0;
  text-decoration: underline;
  text-underline-offset: 3px;
  text-decoration-color: var(--line);
}
.hero-secondary:hover { color: var(--ink); text-decoration-color: var(--muted); }

.hero-visual { position: relative; }
.hero-visual svg { width: 100%; height: auto; display: block; overflow: visible; }
.hero-visual-tag {
  position: absolute;
  right: 4px;
  bottom: -10px;
  background: rgba(16,42,67,.92);
  color: #fff;
  font-size: 11.5px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: 20px;
  box-shadow: 0 10px 24px rgba(16,42,67,.22);
}
.hv-card { fill: rgba(255,255,255,.98); stroke: var(--line); stroke-width: 1; }
.hv-card-selected { fill: rgba(255,255,255,.98); stroke: var(--blue); stroke-width: 2; filter: drop-shadow(0 12px 22px rgba(20,121,210,.16)); }
.hv-chip { fill: rgba(255,255,255,.98); }
.hv-num-circle { fill: var(--blue-soft); }
.hv-num-text { fill: var(--blue); font-weight: 800; font-size: 13px; text-anchor: middle; }
.hv-heading { fill: var(--ink); font-weight: 800; font-size: 12.5px; }
.hv-title { fill: var(--ink); font-weight: 750; font-size: 13px; }
.hv-muted { fill: var(--muted); font-size: 10px; }
.hv-kicker { fill: var(--blue); font-weight: 800; font-size: 9.5px; letter-spacing: .04em; }
.hv-chip-title { fill: var(--ink); font-weight: 700; font-size: 10.5px; }
.hv-crumb-bg { fill: var(--blue-soft); }
.hv-crumb-text { fill: var(--blue); font-weight: 800; font-size: 10.5px; }
.hv-frame-line { stroke: var(--frame); }
.hv-frame-fill { fill: var(--frame); }
.hv-frame-text { fill: var(--frame); font-weight: 850; font-size: 9px; letter-spacing: .05em; }
.hv-commit-line { stroke: var(--commit); }
.hv-commit-fill { fill: var(--commit); }
.hv-commit-text { fill: var(--commit); font-weight: 850; font-size: 9px; letter-spacing: .05em; }
.hv-equip-line { stroke: var(--equip); }
.hv-equip-fill { fill: var(--equip); }
.hv-equip-text { fill: var(--equip); font-weight: 850; font-size: 9px; letter-spacing: .05em; }
.hv-edge { fill: none; stroke: #c3d5e0; stroke-width: 2; }
.hv-edge-anim { stroke-dasharray: 420; stroke-dashoffset: 420; animation: hvDraw .85s ease forwards; }
.hv-edge-1 { animation-delay: .1s; }
.hv-edge-2 { animation-delay: .45s; }
.hv-edge-3 { animation-delay: .55s; }
.hv-edge-4 { animation-delay: .65s; }
@keyframes hvDraw { to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  .hv-edge-anim { animation: none; stroke-dashoffset: 0; }
}

.explore-more { width: min(1180px, calc(100% - 42px)); margin: 12px auto 0; }
.explore-more-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.explore-more-head h2 { font-size: 17px; margin: 0; }
.explore-more-head p { margin: 0; color: var(--muted); font-size: 13px; }
.home-cards.home-cards--secondary { width: auto; margin: 0; position: static; grid-template-columns: repeat(3, 1fr); }
.home-cards--secondary .entry-card { min-height: auto; padding: 20px 22px; }
.home-cards--secondary .entry-icon { width: 34px; height: 34px; margin-bottom: 12px; font-size: 13px; }
.home-cards--secondary h3 { font-size: 15px; margin: 0 0 5px; }
.home-cards--secondary p { font-size: 12.5px; margin-bottom: 10px; line-height: 1.45; }

.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; margin-bottom: 34px; }
.page-head h2 { margin-bottom: 8px; }
.path-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; margin: 36px 0 36px; }
.path-card { padding: 30px; min-height: 210px; cursor: pointer; text-align: left; }
.path-card .path-visual { width: 54px; height: 54px; border-radius: 17px; display:grid; place-items:center; background:#eef6fd; color: var(--blue); margin-bottom: 35px; font-weight: 850; }
.path-card p { color: var(--muted); line-height: 1.5; }
.path-card.disabled { cursor: default; opacity: .58; }
.path-card.disabled:hover { transform:none; box-shadow:none; border-color:var(--line); }
.browse-all { display: grid; grid-template-columns: 1fr auto 1fr; gap: 16px; align-items: center; margin-top: 22px; }
.browse-all::before, .browse-all::after { content:""; height:1px; background:var(--line); }
.browse-label { font-size: 11px; text-transform: uppercase; letter-spacing: .16em; color: #7a8c9e; font-weight:800; }
.secondary-actions { display:flex; gap:12px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
.outline-btn, .ghost-btn, .primary-btn, .back-btn, .filter-btn {
  border-radius: 10px;
  padding: 10px 15px;
  font-weight: 720;
  cursor: pointer;
}
.outline-btn { border: 1px solid #cbdbe8; background: white; color: #185a91; }
.outline-btn:hover { border-color:#8fb9d9; background:#f8fcff; }
.ghost-btn { border: 0; background: transparent; color: var(--blue); }
.primary-btn { border:0; background:var(--blue); color:white; box-shadow:0 7px 18px rgba(20,121,210,.18); }
.primary-btn:hover { background:#0d6cbc; }
.back-btn { border:0; background:transparent; color: var(--blue); padding-left:0; display:inline-flex; align-items:center; gap:6px; }
.back-btn svg { width:17px; height:17px; }

.domain-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
.domain-card { padding: 24px; min-height: 190px; cursor:pointer; text-align:left; display:flex; flex-direction:column; }
.domain-card h3 { margin-bottom:10px; }
.domain-card p { color: var(--muted); line-height:1.5; }
.domain-card .chev { margin-top:auto; align-self:flex-end; color:var(--blue); }
.domain-card .chev svg { width:19px; height:19px; }
.domain-card.not-loaded { opacity:.62; }
.domain-card.not-loaded:hover { opacity:.8; }

.domain-title-row { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; margin-bottom:26px; }
.domain-heading { display:flex; gap:16px; align-items:flex-start; }
.domain-heading .domain-icon { flex:0 0 auto; margin:0; }
.domain-heading h2 { margin-bottom:8px; }
.filter-btn { border:1px solid #bcd7ec; background:white; color:#1768a6; display:inline-flex; gap:8px; align-items:center; }
.filter-btn svg { width:17px; height:17px; }
.active-context { display:flex; flex-wrap:wrap; gap:8px; margin: -4px 0 22px; }
.context-chip { border-radius:20px; background:#eef6fd; color:#245e8b; font-size:12px; font-weight:700; padding:7px 10px; }

.blocker-list { display:flex; flex-direction:column; gap:10px; }
.blocker-card { border:1px solid var(--line); background:white; border-radius:13px; overflow:hidden; transition:border-color .18s ease, box-shadow .18s ease; }
.blocker-card.open { border-color:#bdd8ec; box-shadow:0 9px 25px rgba(16,42,67,.05); }
.blocker-summary { width:100%; border:0; background:white; text-align:left; padding:20px 22px; display:grid; grid-template-columns:1fr auto; gap:18px; cursor:pointer; }
.blocker-title-line { display:flex; align-items:center; flex-wrap:wrap; gap:9px; margin-bottom:5px; }
.blocker-title-line strong { color:#17334c; font-size:16px; }
.stage-badge { display:inline-flex; border-radius:20px; background:#eef6fd; color:#1769aa; font-size:11px; font-weight:780; padding:5px 8px; }
.blocker-statement { color:#657a8c; line-height:1.48; margin:0; font-size:14px; }
.chevron { color:#4f7b9b; transition:transform .2s; align-self:center; }
.blocker-card.open .chevron { transform:rotate(90deg); }
.chevron svg { width:19px; height:19px; }
.blocker-detail { padding:0 22px 24px; border-top:1px solid var(--line-2); }
.detail-actions { display:flex; justify-content:flex-end; padding:12px 0 4px; }
.save-btn { border:0; background:transparent; color:#486b84; cursor:pointer; display:inline-flex; align-items:center; gap:6px; padding:7px 9px; border-radius:8px; }
.save-btn:hover { background:#f3f8fb; }
.save-btn.saved { color:var(--blue); background:#eef6fd; }
.save-btn svg { width:17px; height:17px; }
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:12px 0 16px; }
.detail-panel { border:1px solid var(--line-2); background:#fbfdfe; border-radius:12px; padding:16px; }
.detail-label { font-size:12px; font-weight:800; color:#28465d; margin-bottom:7px; }
.detail-panel p { color:#5f7486; line-height:1.55; margin:0; font-size:13.5px; }
.meta-row { display:grid; grid-template-columns:1.2fr .8fr 1fr; gap:12px; padding:13px 0 20px; border-bottom:1px solid var(--line-2); }
.meta-item small { display:block; color:#8292a1; font-weight:700; font-size:10px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:5px; }
.meta-item span { font-size:12.5px; color:#456075; line-height:1.4; }
.enable-head { display:flex; justify-content:space-between; gap:18px; align-items:center; margin:22px 0 15px; }
.enable-head h3 { margin:0; font-size:16px; }
.mechanism-chips { display:flex; gap:7px; flex-wrap:wrap; }
.mech-chip { border-radius:20px; padding:6px 10px; background: color-mix(in srgb, var(--mech) 10%, white); color:var(--mech); font-size:11px; font-weight:800; }
.enabler-group { margin-top:13px; }
.enabler-group-title { display:flex; align-items:center; gap:7px; color:var(--equip); font-size:12px; font-weight:820; margin:0 0 8px; }
.enabler-group-title::before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; }
.enabler-list { display:flex; flex-direction:column; gap:7px; }
.enabler-card { border:1px solid var(--line); border-radius:10px; background:white; overflow:hidden; }
.enabler-summary { width:100%; border:0; background:white; padding:14px 15px; text-align:left; display:grid; grid-template-columns:1fr auto; gap:16px; cursor:pointer; }
.enabler-summary strong { display:block; color:#19364e; margin-bottom:5px; font-size:13.5px; }
.enabler-summary p { margin:0; color:#6a7f90; line-height:1.45; font-size:12.5px; }
.enabler-detail { padding:0 15px 16px; border-top:1px solid var(--line-2); }
.enabler-detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding-top:14px; }
.mini-section { background:#fafcfd; border-radius:9px; padding:12px; border:1px solid var(--line-2); }
.mini-section b { display:block; font-size:11px; color:#38556b; margin-bottom:6px; }
.mini-section p { margin:0; color:#64798a; line-height:1.5; font-size:12px; }
.enabler-stakeholders { margin-top:10px; color:#6a7f90; font-size:12px; line-height:1.5; }
.relevance-btn { border:0; padding:9px 0 0; background:transparent; color:var(--blue); font-size:12px; font-weight:750; cursor:pointer; }
.rationale { margin:9px 0 0; padding:11px 12px; background:#f2f8fd; border-left:3px solid #8ec3ed; color:#587185; font-size:12px; line-height:1.5; border-radius:0 8px 8px 0; }
.show-more { border:0; background:transparent; color:var(--blue); font-weight:730; font-size:12px; cursor:pointer; margin:9px 0 0 10px; }
.empty-state { border:1px dashed #cddae4; border-radius:14px; padding:34px; text-align:center; color:#6c8192; background:#fbfdfe; }

.role-modal, .search-modal, .filter-drawer {
  position:fixed;
  inset:0;
  background:rgba(9,28,43,.36);
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  backdrop-filter: blur(4px);
}
.modal-card { width:min(650px,100%); max-height:min(760px,calc(100vh - 40px)); overflow:auto; background:white; border-radius:18px; box-shadow:0 26px 80px rgba(9,28,43,.24); padding:26px; }
.modal-head { display:flex; justify-content:space-between; gap:18px; align-items:flex-start; margin-bottom:18px; }
.modal-head h3 { margin-bottom:7px; font-size:22px; }
.close-modal { border:0; width:38px; height:38px; border-radius:9px; background:#f3f6f8; cursor:pointer; display:grid; place-items:center; }
.close-modal svg { width:18px; height:18px; }

.selection-summary { display:flex; gap:8px; flex-wrap:wrap; margin:18px 0 28px; }

.browse-section { margin-top:34px; }

/* Stage Gate explorer */
.stage-rail { position:relative; display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:0; margin:28px 0 34px; padding:6px 0; }
.stage-rail::before { content:""; position:absolute; left:8%; right:8%; top:27px; height:2px; background:#dbe7ef; z-index:0; }
.stage-step { position:relative; z-index:1; border:0; background:transparent; text-align:center; cursor:pointer; padding:0 7px; color:#6d8394; }
.stage-step-dot { width:43px; height:43px; margin:0 auto 10px; display:grid; place-items:center; border-radius:50%; border:2px solid #cbdbe6; background:white; color:#557185; font-weight:850; transition:.2s ease; }
.stage-step-copy { display:flex; flex-direction:column; gap:4px; }
.stage-step-copy strong { font-size:11px; line-height:1.25; color:#5c7283; }
.stage-step-copy small { font-size:10px; color:#95a3ae; }
.stage-step.active .stage-step-dot { background:var(--navy); border-color:var(--navy); color:white; box-shadow:0 0 0 6px #edf5fb; }
.stage-step.active .stage-step-copy strong { color:#153750; }
.stage-gate-focus { display:flex; align-items:flex-start; gap:16px; border:1px solid var(--line); background:white; border-radius:14px; padding:18px 20px; margin-bottom:18px; }
.stage-focus-number { flex:0 0 auto; background:#edf6fd; color:#1769aa; border-radius:10px; padding:8px 10px; font-size:12px; font-weight:850; }
.stage-gate-focus h3 { margin:0 0 5px; }
.stage-gate-focus p { margin:0; color:#6b7f90; font-size:13px; }

/* Blocker dependency layer */
.meta-row { grid-template-columns:repeat(4,minmax(0,1fr)); }
.dependency-inline { margin:18px 0 6px; border:1px solid var(--line-2); border-radius:12px; background:#fbfdfe; overflow:hidden; }
.dependency-toggle { width:100%; border:0; background:transparent; padding:14px 15px; display:flex; align-items:center; justify-content:space-between; gap:16px; cursor:pointer; text-align:left; }
.dependency-toggle strong { display:block; color:#29485f; font-size:13px; margin-bottom:3px; }
.dependency-toggle span:not(.chevron) { color:#7b8e9d; font-size:11.5px; }
.dependency-body { border-top:1px solid var(--line-2); padding:14px; display:grid; grid-template-columns:1fr 1fr; gap:14px; background:white; }
.dependency-column { min-width:0; }
.dependency-node { width:100%; border:1px solid #dce6ed; background:#fbfdfe; border-radius:9px; padding:10px 11px; margin-top:7px; text-align:left; cursor:pointer; display:flex; gap:9px; align-items:flex-start; }
.dependency-node:hover { border-color:#a9c9df; background:#f5faff; }
.dependency-node-stage { flex:0 0 auto; font-size:9px; font-weight:850; color:#2771a8; background:#eaf4fb; border-radius:10px; padding:4px 6px; }
.dependency-node strong { color:#36536a; font-size:11.5px; line-height:1.35; }
.dependency-empty { color:#8b9aa6; font-size:12px; margin:8px 0 0; }

/* Semantic-zoom timeline */
.timeline-page { width:min(1280px,calc(100% - 42px)); }
.tl-page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:18px; }

.tl-breadcrumb { display:flex; align-items:center; flex-wrap:wrap; gap:7px; min-height:26px; margin:12px 0 16px; font-size:11.5px; color:#8494a1; }
.tl-breadcrumb button { border:0; background:transparent; color:#39749f; cursor:pointer; padding:2px 0; font:inherit; }
.tl-breadcrumb i { font-style:normal; color:#a8b4bd; }
.tl-rail-wrap { position:relative; margin:8px 0 28px; padding:8px 0 4px; overflow-x:auto; }
.tl-rail-line { position:absolute; left:7%; right:7%; top:31px; height:2px; background:linear-gradient(90deg,#c7d9e7,#a9c9df); }
.tl-rail { position:relative; z-index:1; min-width:860px; display:grid; grid-template-columns:repeat(6,1fr); }
.tl-gate { border:0; background:transparent; cursor:pointer; text-align:center; padding:0 9px; color:#748999; }
.tl-gate-dot { width:46px; height:46px; margin:0 auto 9px; display:grid; place-items:center; border-radius:50%; background:white; border:2px solid #c6d9e7; color:#5c778d; font-weight:850; transition:.2s ease; }

.tl-stage-area { min-height:350px; }
.reveal { animation:tlReveal .28s ease both; }
@keyframes tlReveal { from { opacity:0; transform:translateY(7px); } to { opacity:1; transform:none; } }
.tl-start-hint { max-width:560px; margin:65px auto 0; text-align:center; color:#728899; }
.tl-start-hint > span { display:inline-block; background:#edf6fd; color:#2673a9; border-radius:20px; padding:6px 10px; font-size:10px; font-weight:850; text-transform:uppercase; letter-spacing:.09em; margin-bottom:12px; }
.tl-start-hint h3 { font-size:24px; margin-bottom:8px; }
.tl-stage { padding-top:6px; }
.tl-stage-intro { display:grid; grid-template-columns:minmax(260px,.75fr) 1fr; gap:28px; align-items:end; margin-bottom:18px; padding:18px 2px; border-bottom:1px solid var(--line); }

.tl-blocker-cloud { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:11px; }
.tl-blocker-node { border:1px solid #d9e5ed; background:white; border-radius:13px; padding:17px; text-align:left; cursor:pointer; min-height:135px; transition:.18s ease; box-shadow:0 4px 15px rgba(18,52,76,.025); }
.tl-blocker-node:hover { transform:translateY(-2px); border-color:#9fc5df; box-shadow:0 10px 28px rgba(18,52,76,.07); }
.tl-blocker-node > span { display:block; color:#2c78aa; font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; font-weight:800; margin-bottom:8px; }
.tl-blocker-node strong { display:block; color:#203f57; font-size:13.5px; line-height:1.35; margin-bottom:7px; }
.tl-blocker-node small { color:#7b8d9a; line-height:1.4; font-size:11.2px; }
.tl-focus-kicker { text-align:center; color:#7f92a0; font-size:10px; font-weight:850; text-transform:uppercase; letter-spacing:.14em; margin:16px 0 20px; }
.tl-dependency-map { position:relative; display:grid; grid-template-columns:1fr minmax(280px,1.05fr) 1fr; gap:38px; align-items:center; padding:20px 0 34px; }
.tl-dependency-map::before { content:""; position:absolute; left:21%; right:21%; top:50%; height:1px; background:#c9dbe7; z-index:0; }
.tl-dep-side,.tl-center-wrap { position:relative; z-index:1; }
.tl-side-title { display:flex; align-items:center; gap:7px; margin-bottom:10px; color:#718696; font-size:10px; font-weight:850; text-transform:uppercase; letter-spacing:.09em; }
.tl-side-title span { width:24px; height:24px; display:grid; place-items:center; background:#eef5fa; border-radius:50%; color:#316f9b; }
.tl-dep-stack { display:flex; flex-direction:column; gap:7px; }
.tl-dep-node { border:1px solid #dbe6ed; background:white; border-radius:10px; padding:10px 11px; text-align:left; cursor:pointer; transition:.16s ease; }
.tl-dep-node:hover { border-color:#92bad5; transform:translateX(2px); }
.tl-upstream .tl-dep-node:hover { transform:translateX(-2px); }
.tl-dep-node span { display:block; color:#2d78aa; font-size:9px; font-weight:800; margin-bottom:4px; }
.tl-dep-node strong { color:#3b566a; font-size:11.5px; line-height:1.3; }
.tl-none { border:1px dashed #d8e3ea; border-radius:10px; padding:14px; color:#9aa7b0; font-size:11.5px; background:#fbfdfe; }
.tl-center-wrap { display:grid; place-items:center; }
.tl-center-node { width:100%; border:1px solid #9fc6e1; background:linear-gradient(180deg,#ffffff,#f7fbfe); border-radius:18px; padding:24px; cursor:pointer; text-align:left; box-shadow:0 14px 38px rgba(21,64,94,.10); transition:.2s ease; }
.tl-center-node:hover { transform:scale(1.015); box-shadow:0 18px 46px rgba(21,64,94,.14); }
.tl-center-node strong { display:block; color:#163b56; font-size:18px; line-height:1.3; margin:11px 0 8px; }
.tl-center-node p { color:#667e90; line-height:1.5; font-size:12.5px; margin-bottom:15px; }

.tl-detail { max-width:1050px; margin:0 auto; }
.tl-detail-hero { display:flex; justify-content:space-between; align-items:flex-start; gap:28px; padding:22px 0 20px; border-bottom:1px solid var(--line); }

.tl-meta-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:8px 0 28px; }
.tl-meta-grid > div { background:#fafcfd; border:1px solid var(--line-2); border-radius:10px; padding:12px; }
.tl-meta-grid small { display:block; color:#8a99a5; text-transform:uppercase; letter-spacing:.08em; font-size:9px; font-weight:850; margin-bottom:4px; }

.tl-mechanism-section { margin-top:34px; padding-top:26px; border-top:1px solid var(--line); }
.tl-section-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; margin-bottom:15px; }

.tl-mechanisms { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }

.tl-mechanism > span { color:var(--mech); font-size:12px; font-weight:850; }

.tl-mechanism:hover,.tl-mechanism.active { border-color:color-mix(in srgb,var(--mech) 42%,white); background:color-mix(in srgb,var(--mech) 6%,white); }
.tl-enabler-zone { margin-top:23px; }
.tl-enabler-zone-head { display:flex; align-items:baseline; gap:13px; margin-bottom:10px; }
.tl-enabler-zone-head > span { font-weight:850; font-size:14px; }
.tl-enabler-zone-head p { margin:0; color:#7b8d9a; font-size:11.5px; }
.tl-enabler-list { display:flex; flex-direction:column; gap:7px; }
.tl-enabler-card { border:1px solid var(--line); border-radius:11px; background:white; overflow:hidden; }

<script>
const app = document.getElementById('app');
const modalRoot = document.getElementById('modalRoot');
const searchBtn = document.getElementById('searchBtn');
const selectionBtn = document.getElementById('selectionBtn');
const bookmarkCount = document.getElementById('bookmarkCount');
const brandBtn = document.getElementById('brandBtn');
const navButtons = [...document.querySelectorAll('[data-route]')];

const state = {
  data: null,
  route: 'home',
  domain: null,
  openBlocker: null,
  openEnablers: new Set(),
  expandedEnablerLimit: {},
  stakeholders: [],
  dimension: '',
  bookmarks: loadBookmarks(),
  searchType: 'all',
  allMechanism: 'all',
  stageGateView: 1,
  openDependencies: new Set(),
  timelineGate: null,
  timelineBlocker: null,
  timelineDetail: false,
  timelineMechanism: null
};

function loadBookmarks() {
  try { return JSON.parse(localStorage.getItem('aistExplorerBookmarks') || '{"blockers":[],"enablers":[]}'); }
  catch { return { blockers: [], enablers: [] }; }
}
function saveBookmarks() {
  localStorage.setItem('aistExplorerBookmarks', JSON.stringify(state.bookmarks));
  updateBookmarkCount();
}
function updateBookmarkCount() {
  const n = state.bookmarks.blockers.length + state.bookmarks.enablers.length;
  bookmarkCount.textContent = n;
  bookmarkCount.hidden = !n;
}
function icon(name, cls='') { return `<svg class="${cls}"><use href="#i-${name}"></use></svg>`; }
function escapeHtml(value='') {
  return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}
function truncate(text, n=150) {
  const s = String(text || '');
  return s.length > n ? s.slice(0,n).trimEnd() + '…' : s;
}
function unique(arr) { return [...new Set(arr)].sort((a,b)=>a.localeCompare(b)); }
function toast(message) {
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = message;
  document.getElementById('toastRoot').appendChild(el);
  setTimeout(()=>el.remove(), 2200);
}

async function init() {
  if (window.__EXPLORER_DATA__) {
    state.data = window.__EXPLORER_DATA__;
  } else {
    const res = await fetch('data/explorer-data.json');
    state.data = await res.json();
  }
  updateBookmarkCount();
  bindGlobal();
  routeFromHash();
}

function bindGlobal() {
  brandBtn.addEventListener('click', ()=>navigate('home'));
  navButtons.forEach(btn => btn.addEventListener('click', ()=>navigate(btn.dataset.route)));
  selectionBtn.addEventListener('click', ()=>navigate('selection'));
  searchBtn.addEventListener('click', openSearch);
  window.addEventListener('hashchange', routeFromHash);
}

function navigate(route) {
  const map = { home:'#home', explore:'#explore', maturity:'#maturity', selection:'#selection', domains:'#domains', stage:'#stage-gates', domain:'#domain/data-foundations' };
  location.hash = map[route] || `#${route}`;
}
function routeFromHash() {
  const hash = location.hash || '#home';
  if (hash === '#timeline') {
    window.location.replace('./timeline/');
    return;
  }
  if (hash.startsWith('#domain/')) { state.route='domain'; state.domain=hash.split('/')[1]; }
  else state.route = hash.slice(1) || 'home';
  state.openBlocker = null;
  state.openEnablers.clear();
  state.openDependencies.clear();
  render();
}

function render() {
  searchBtn.hidden = !['explore','domains','domain','all-blockers','all-enablers','stage-gates'].includes(state.route);
  navButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.route === (state.route === 'home' ? '' : state.route === 'domain' || state.route === 'domains' || state.route === 'all-blockers' || state.route === 'all-enablers' || state.route === 'stage-gates' ? 'explore' : state.route)));
  const renderers = { home:renderHome, explore:renderExplore, domains:renderDomains, domain:renderDomain, 'all-blockers':renderAllBlockers, 'all-enablers':renderAllEnablers, maturity:renderMaturity, selection:renderSelection, 'stage-gates':renderStageGates };
  (renderers[state.route] || renderHome)();
  app.focus({preventScroll:true});
}

function renderHome() {
  const mechanismShort = {
    Frame: 'Define the problem and value.',
    Commit: 'Create ownership and decision rights.',
    Equip: 'Provide skills, data and platforms.',
    Assure: 'Clarify safety, legal and reliability needs.',
    Operate: 'Embed AI in operational workflows.',
    Learn: 'Monitor, retrain and improve over time.'
  };
  const mechs = state.data.mechanisms.map(m => `<div class="mechanism-explainer" style="--mech:var(--${m.key.toLowerCase()})"><span class="mechanism-dot"></span><strong>${m.key}</strong><small>${mechanismShort[m.key] || ''}</small></div>`).join('');
  app.innerHTML = `
    <section class="hero">
      <div class="hero-inner hero-grid">
        <div class="hero-copy">
          <p class="eyebrow">UIC AIST · Insight to impact</p>
          <h1>Understand.<br>Overcome.<br>Scale AI.</h1>
          <p class="lead">Pan through the six lifecycle Stage Gates on one canvas and watch each blocker resolve into the enablers that overcome it.</p>
          <div class="hero-actions">
            <a class="hero-cta" href="./timeline/">Open the Timeline <span class="hero-cta-arrow">→</span></a>
            <button class="hero-secondary" data-entry="explore">Browse the explorer instead</button>
          </div>
        </div>
        <div class="hero-visual">
          ${timelinePreviewSvg()}
          <span class="hero-visual-tag">Live, explorable canvas</span>
        </div>
      </div>
    </section>
    <section class="explore-more">
      <div class="explore-more-head">
        <h2>Other ways into the same data</h2>
        <p>Same underlying dataset, different lenses.</p>
      </div>
      <div class="home-cards home-cards--secondary">
        ${entryCard('Explore the landscape','Browse blockers and enablers across domains, stages and stakeholders.','Explore','explore','↗')}
        ${entryCard('View for my role','Focus the landscape on the stakeholders most relevant to you.','Choose perspective','role','◎')}
        ${entryCard('Maturity assessment','Assess the maturity of your organisation or AI initiative.','Open assessment','maturity','▥')}
      </div>
    </section>
    <section class="framework-strip">
      <div class="framework-title">Enablers act through six mechanisms</div>
      <div class="mechanism-explainer-grid">${mechs}</div>
    </section>`;
  app.querySelectorAll('[data-entry]').forEach(btn => btn.addEventListener('click', () => {
    const action = btn.dataset.entry;
    if (action === 'role') openRolePicker(); else navigate(action);
  }));
}
function entryCard(title, text, link, action, symbol) {
  return `<button class="entry-card" data-entry="${action}"><div class="entry-icon">${symbol}</div><h3>${title}</h3><p>${text}</p><span class="card-link">${link} →</span></button>`;
}


function timelinePreviewSvg() {
  return `<svg viewBox="0 0 620 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Preview of the Timeline: Stage Gate 1 expanding into a blocker and three enablers">
    <rect class="hv-crumb-bg" x="6" y="6" width="228" height="27" rx="13.5"></rect>
    <text class="hv-crumb-text" x="20" y="24">Stage Gate → Blocker → Enablers</text>

    <path class="hv-edge hv-edge-anim hv-edge-1" d="M176,202 C208,202 214,196 250,196"></path>
    <path class="hv-edge hv-edge-anim hv-edge-2" d="M460,202 C495,202 495,75 468,75"></path>
    <path class="hv-edge hv-edge-anim hv-edge-3" d="M460,202 C495,202 495,195 468,195"></path>
    <path class="hv-edge hv-edge-anim hv-edge-4" d="M460,202 C495,202 495,317 468,317"></path>

    <rect class="hv-card" x="6" y="148" width="170" height="108" rx="18"></rect>
    <circle class="hv-num-circle" cx="42" cy="180" r="16"></circle>
    <text class="hv-num-text" x="42" y="185">1</text>
    <text class="hv-heading" x="68" y="177">Stage Gate 1</text>
    <text class="hv-muted" x="26" y="208">Strategic Alignment</text>
    <text class="hv-muted" x="26" y="222">&amp; Idea Validation</text>

    <rect class="hv-card-selected" x="250" y="140" width="210" height="124" rx="16"></rect>
    <text class="hv-kicker" x="270" y="168">STAGE 1 · BLOCKER</text>
    <text class="hv-title" x="270" y="190">Unclear financial</text>
    <text class="hv-title" x="270" y="207">implications, risks and</text>
    <text class="hv-title" x="270" y="224">investment logic</text>
    <text class="hv-muted" x="270" y="248">Resolved by 3 enablers</text>

    <rect class="hv-chip" x="468" y="40" width="146" height="70" rx="14" stroke-width="1.5" style="stroke:var(--frame)"></rect>
    <circle class="hv-frame-fill" cx="486" cy="58" r="4"></circle>
    <text class="hv-frame-text" x="498" y="61">FRAME</text>
    <text class="hv-chip-title" x="482" y="80">AI-specific portfolio</text>
    <text class="hv-chip-title" x="482" y="94">business case</text>

    <rect class="hv-chip" x="468" y="160" width="146" height="70" rx="14" stroke-width="1.5" style="stroke:var(--commit)"></rect>

    <text class="hv-chip-title" x="482" y="214">AI scaling</text>

    <rect class="hv-chip" x="468" y="280" width="146" height="78" rx="14" stroke-width="1.5" style="stroke:var(--equip)"></rect>
    <circle class="hv-equip-fill" cx="486" cy="298" r="4"></circle>
    <text class="hv-equip-text" x="498" y="301">EQUIP</text>
    <text class="hv-chip-title" x="482" y="320">Enterprise-wide data</text>
    <text class="hv-chip-title" x="482" y="334">integration strategy</text>
  </svg>`;
}

function renderExplore() {
  app.innerHTML = `<section class="page narrow">
    <div class="page-head"><div><p class="eyebrow">Explore</p><h2>Choose a path.</h2><p class="subtle">Start broad. Open detail only when it becomes useful.</p></div></div>
    ${activePerspectiveHtml()}
    <div class="path-grid">
      <button class="path-card" id="byDomain"><div class="path-visual">▦</div><h3>By Domain</h3><p>Explore blockers and enablers by thematic domain.</p><span class="card-link">Choose a domain →</span></button>
      <button class="path-card" id="byStage"><div class="path-visual">┈</div><h3>By Stage Gate</h3><p>Explore blockers along the six lifecycle gates.</p><span class="card-link">Follow the lifecycle →</span></button>
    </div>
    <div class="browse-all"><span class="browse-label">or browse all</span></div>
    <div class="secondary-actions"><button class="outline-btn" id="allBlockers">All Blockers →</button><button class="outline-btn" id="allEnablers">All Enablers →</button></div>
  </section>`;
  document.getElementById('byDomain').onclick = ()=>navigate('domains');
  document.getElementById('byStage').onclick = ()=>navigate('stage');
  document.getElementById('allBlockers').onclick = ()=>navigate('all-blockers');
  document.getElementById('allEnablers').onclick = ()=>navigate('all-enablers');
}

function activePerspectiveHtml() {
  if (!state.stakeholders.length) return '';
  return `<div class="active-context"><span class="context-chip">Viewing as: ${escapeHtml(state.stakeholders.join(' + '))}</span><button class="ghost-btn" id="changePerspective">Change</button></div>`;
}

function renderDomains() {
  const cards = state.data.domains.map(d => `<button class="domain-card ${d.enabled?'':'not-loaded'}" data-domain="${d.slug}">
    <div class="domain-icon">${domainSymbol(d.slug)}</div><h3>${escapeHtml(d.title)}</h3><p>${escapeHtml(d.description)}</p><span class="chev">${icon('chevron')}</span>
  </button>`).join('');
  app.innerHTML = `<section class="page">
    <button class="back-btn" id="backExplore">${icon('back')} Explore</button>
    <div class="page-head"><div><p class="eyebrow">Explore by domain</p><h2>Where do you want to look?</h2><p class="subtle">Macro-domains organise the experience; the underlying clusters remain unchanged.</p></div></div>
    ${activePerspectiveHtml()}
    <div class="domain-grid">${cards}</div>
  </section>`;
  document.getElementById('backExplore').onclick = ()=>navigate('explore');
  app.querySelectorAll('[data-domain]').forEach(card => card.onclick = () => {
    const d = state.data.domains.find(x=>x.slug===card.dataset.domain);
    if (d.enabled) location.hash = `#domain/${d.slug}`;
    else toast(`${d.title} is reserved for the next data slice.`);
  });
  document.getElementById('changePerspective')?.addEventListener('click', openRolePicker);
}
function domainSymbol(slug) {
  return ({'data-foundations':'◫','technology-infrastructure':'▣','governance-organisation':'◇','people-adoption':'●','legal-safety-assurance':'◆','value-delivery-scale':'▤'})[slug] || '○';
}

function filteredBlockers() {
  let rows = state.data.blockers.filter(b => b.domain === state.domain);
  if (state.stakeholders.length) rows = rows.filter(b => state.stakeholders.some(s => b.stakeholders.includes(s)));
  if (state.dimension) rows = rows.filter(b => b.dimension === state.dimension);
  return rows;
}
function relationsForBlocker(id) { return state.data.relationships.filter(r=>r.blockerId===id); }
function enabler(id) { return state.data.enablers.find(e=>e.id===id); }
function relationship(id, enablerId) { return state.data.relationships.find(r=>r.blockerId===id && r.enablerId===enablerId); }
function visibleEnablersForBlocker(id) {
  let items = relationsForBlocker(id).map(r => ({...enabler(r.enablerId), relationship:r})).filter(x=>x.id);
  if (state.stakeholders.length) items = items.filter(e => state.stakeholders.some(s => e.stakeholders.includes(s)));
  return items;
}

function renderDomain() {
  const domain = state.data.domains.find(d=>d.slug===state.domain);
  if (!domain) return renderDomains();
  const blockers = filteredBlockers();
  const blockerHtml = blockers.length ? blockers.map(renderBlockerCard).join('') : `<div class="empty-state">No blockers match the current filters.</div>`;
  app.innerHTML = `<section class="page">
    <button class="back-btn" id="backDomains">${icon('back')} Back to domains</button>
    <div class="domain-title-row">
      <div class="domain-heading"><div class="domain-icon">${domainSymbol(domain.slug)}</div><div><h2>${escapeHtml(domain.title)}</h2><p class="subtle">${escapeHtml(domain.description)} These foundations are critical to move from isolated pilots towards scalable AI.</p></div></div>
      <button class="filter-btn" id="filterBtn">${icon('filter')} Filters</button>
    </div>
    ${activePerspectiveHtml()}
    <div class="blocker-list">${blockerHtml}</div>
  </section>`;
  document.getElementById('backDomains').onclick = ()=>navigate('domains');
  document.getElementById('filterBtn').onclick = openFilters;
  document.getElementById('changePerspective')?.addEventListener('click', openRolePicker);
  bindBlockerEvents();
}


function rerenderCurrentExploreView() {
  if (state.route === 'all-blockers') return renderAllBlockers();
  if (state.route === 'all-enablers') return renderAllEnablers();
  if (state.route === 'stage-gates') return renderStageGates();
  return renderDomain();
}

function renderAllBlockers() {
  let rows = [...state.data.blockers];
  if (state.stakeholders.length) rows = rows.filter(b => state.stakeholders.some(s => b.stakeholders.includes(s)));
  if (state.dimension) rows = rows.filter(b => b.dimension === state.dimension);

  const sections = state.data.domains.map(domain => {
    const items = rows.filter(b => b.domain === domain.slug);
    if (!items.length) return '';
    return `<section class="browse-section">
      <div class="browse-section-head">
        <div><p class="eyebrow">Domain</p><h3>${escapeHtml(domain.title)}</h3></div>
        <span class="stat-chip">${items.length} blocker${items.length===1?'':'s'}</span>
      </div>
      <div class="blocker-list">${items.map(renderBlockerCard).join('')}</div>
    </section>`;
  }).join('');

  app.innerHTML = `<section class="page">
    <button class="back-btn" id="backExplore">${icon('back')} Explore</button>
    <div class="domain-title-row">
      <div><p class="eyebrow">Browse all</p><h2>All Blockers</h2><p class="subtle">Browse the complete blocker landscape, grouped by domain. Open a blocker only when you need the detail.</p></div>
      <button class="filter-btn" id="filterBtn">${icon('filter')} Filters</button>
    </div>
    ${activePerspectiveHtml()}
    ${sections || '<div class="empty-state">No blockers match the current filters.</div>'}
  </section>`;

  document.getElementById('backExplore').onclick = ()=>navigate('explore');
  document.getElementById('filterBtn').onclick = openFilters;
  document.getElementById('changePerspective')?.addEventListener('click', openRolePicker);
  bindBlockerEvents();
}

function mechanismsForEnabler(id) {
  return unique(state.data.relationships.filter(r=>r.enablerId===id).map(r=>r.mechanism).filter(Boolean));
}

function relatedBlockersForEnabler(id) {
  return state.data.relationships
    .filter(r=>r.enablerId===id)
    .map(r=>({relationship:r, blocker:state.data.blockers.find(b=>b.id===r.blockerId)}))
    .filter(x=>x.blocker);
}

function renderAllEnablers() {
  const mechanismOrder = state.data.mechanisms.map(m=>m.key);
  const tabs = ['all', ...mechanismOrder].map(m => {
    const active = state.allMechanism === m;
    const label = m === 'all' ? 'All' : m;
    const style = m === 'all' ? '' : `style="--mech:var(--${m.toLowerCase()})"`;
    return `<button class="mechanism-filter ${active?'active':''}" data-mechanism-filter="${m}" ${style}>${label}</button>`;
  }).join('');

  const mechanismSections = mechanismOrder.map(mechanism => {
    if (state.allMechanism !== 'all' && state.allMechanism !== mechanism) return '';
    let items = state.data.enablers.filter(e => mechanismsForEnabler(e.id).includes(mechanism));
    if (state.stakeholders.length) items = items.filter(e => state.stakeholders.some(s => e.stakeholders.includes(s)));
    if (!items.length) return '';
    const description = state.data.mechanisms.find(m=>m.key===mechanism)?.description || '';
    return `<section class="browse-section">
      <div class="browse-section-head mechanism-section-head" style="--mech:var(--${mechanism.toLowerCase()})">
        <div><div class="enabler-group-title" style="color:var(--${mechanism.toLowerCase()})">${mechanism}</div><p class="subtle">${escapeHtml(description)}</p></div>
        <span class="stat-chip">${items.length} enabler${items.length===1?'':'s'}</span>
      </div>
      <div class="enabler-list">${items.map(e=>renderStandaloneEnablerCard(e, mechanism)).join('')}</div>
    </section>`;
  }).join('');

  app.innerHTML = `<section class="page">
    <button class="back-btn" id="backExplore">${icon('back')} Explore</button>
    <div class="page-head"><div><p class="eyebrow">Browse all</p><h2>All Enablers</h2><p class="subtle">Explore enablers by the way they help overcome barriers to scaling AI.</p></div></div>
    ${activePerspectiveHtml()}
    <div class="mechanism-filter-row">${tabs}</div>
    ${mechanismSections || '<div class="empty-state">No enablers match the current perspective.</div>'}
  </section>`;

  document.getElementById('backExplore').onclick = ()=>navigate('explore');
  document.getElementById('changePerspective')?.addEventListener('click', openRolePicker);
  app.querySelectorAll('[data-mechanism-filter]').forEach(btn => btn.onclick = () => {
    state.allMechanism = btn.dataset.mechanismFilter;
    state.openEnablers.clear();
    renderAllEnablers();
  });
  bindStandaloneEnablerEvents();
}

function renderStandaloneEnablerCard(e, mechanism) {
  const openKey = `all:${e.id}`;
  const open = state.openEnablers.has(openKey);
  const saved = state.bookmarks.enablers.includes(e.id);

    </button>
    ${open ? `<div class="enabler-detail">
      <div class="detail-actions"><button class="save-btn ${saved?'saved':''}" data-save-standalone-enabler="${e.id}">${icon('bookmark')} ${saved?'Saved':'Save'}</button></div>
      <div class="enabler-detail-grid">

      <div class="enabler-stakeholders"><b>Stakeholders:</b> ${escapeHtml(e.stakeholders.join(' · '))}</div>

function bindStandaloneEnablerEvents() {
  app.querySelectorAll('[data-toggle-standalone-enabler]').forEach(btn => btn.onclick = () => {
    const key = btn.dataset.toggleStandaloneEnabler;
    state.openEnablers.has(key) ? state.openEnablers.delete(key) : state.openEnablers.add(key);
    renderAllEnablers();
  });
  app.querySelectorAll('[data-save-standalone-enabler]').forEach(btn => btn.onclick = e => {

    el.hidden = !el.hidden;

}

function blockerById(id) {
  return state.data.blockers.find(b=>b.id===Number(id));
}

function dependencyContext(id) {
  const deps = state.data.blockerDependencies || [];
  const upstreamIds = [...new Set(deps.filter(d=>d.blockerId===id).map(d=>d.dependsOnBlockerId))];
  const downstreamIds = [...new Set(deps.filter(d=>d.dependsOnBlockerId===id).map(d=>d.blockerId))];
  return {
    upstream: upstreamIds.map(blockerById).filter(Boolean),
    downstream: downstreamIds.map(blockerById).filter(Boolean)
  };
}

function focusBlocker(id) {
  const target = blockerById(id);
  if (!target) return;
  const hash = `#domain/${target.domain}`;
  const open = () => {
    state.route='domain';
    state.domain=target.domain;
    state.openBlocker=target.id;
    state.openEnablers.clear();
    renderDomain();
    setTimeout(()=>document.querySelector(`[data-blocker-card="${target.id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}),40);
  };
  if (location.hash === hash) open();
  else {
    location.hash = hash;
    setTimeout(open,80);
  }
}

function renderDependencySection(b) {
  const deps = dependencyContext(b.id);
  const open = state.openDependencies.has(b.id);
  const node = x => `<button class="dependency-node" data-dependency-blocker="${x.id}">
    <span class="dependency-node-stage">Gate ${x.stageGate || '—'}</span>
    <strong>${escapeHtml(x.title)}</strong>
  </button>`;
  return `<section class="dependency-inline">
    <button class="dependency-toggle" data-toggle-dependencies="${b.id}">
      <div><strong>Dependencies</strong><span>${deps.upstream.length} upstream · ${deps.downstream.length} downstream</span></div>
      <span class="chevron" style="transform:${open?'rotate(90deg)':'none'}">${icon('chevron')}</span>
    </button>
    ${open ? `<div class="dependency-body">
      <div class="dependency-column">
        <div class="detail-label">Depends on</div>
        ${deps.upstream.length ? deps.upstream.map(node).join('') : '<p class="dependency-empty">No upstream dependencies mapped.</p>'}
      </div>
      <div class="dependency-column">
        <div class="detail-label">Other blockers depending on this</div>
        ${deps.downstream.length ? deps.downstream.map(node).join('') : '<p class="dependency-empty">No downstream dependencies mapped.</p>'}
      </div>
    </div>` : ''}
  </section>`;
}

function renderBlockerCard(b) {
  const open = state.openBlocker === b.id;
  return `<article class="blocker-card ${open?'open':''}" data-blocker-card="${b.id}">
    <button class="blocker-summary" data-toggle-blocker="${b.id}">
      <div><div class="blocker-title-line">${b.stageGate ? `<span class="stage-badge">${escapeHtml(b.stageGate)}</span>`:''}<strong>${escapeHtml(b.title)}</strong></div><p class="blocker-statement">${escapeHtml(b.statement)}</p></div>
      <span class="chevron">${icon('chevron')}</span>
    </button>
    ${open ? renderBlockerDetail(b) : ''}
  </article>`;
}
function renderBlockerDetail(b) {
  const saved = state.bookmarks.blockers.includes(b.id);
  const items = visibleEnablersForBlocker(b.id);
  const groups = groupByMechanism(items);
  const chips = Object.entries(groups).map(([m,arr])=>`<span class="mech-chip" style="--mech:var(--${m.toLowerCase()})">${m} ${arr.length}</span>`).join('');
  const enablers = Object.entries(groups).map(([m,arr])=>renderEnablerGroup(b.id,m,arr)).join('');
  return `<div class="blocker-detail">
    <div class="detail-actions"><button class="save-btn ${saved?'saved':''}" data-save-blocker="${b.id}">${icon('bookmark')} ${saved?'Saved':'Save'}</button></div>
    <div class="detail-grid">
      <div class="detail-panel"><div class="detail-label">Why it matters</div><p>${escapeHtml(b.whyItMatters)}</p></div>
      <div class="detail-panel"><div class="detail-label">Consequence</div><p>${escapeHtml(b.consequence)}</p></div>
    </div>
    <div class="meta-row">
      <div class="meta-item"><small>Stage Gate</small><span>${b.stageGate ? `Gate ${b.stageGate} · ${escapeHtml(b.stageGateDescription || '')}` : '—'}</span></div>
      <div class="meta-item"><small>Stakeholders</small><span>${escapeHtml(b.stakeholders.join(' · '))}</span></div>
      <div class="meta-item"><small>Dimension</small><span>${escapeHtml(b.dimension)}</span></div>

    </div>

    ${enablers}
  </div>`;
}

function groupByMechanism(items) {
  return items.reduce((acc,item)=>{ (acc[item.relationship.mechanism] ||= []).push(item); return acc; },{});
}
function renderEnablerGroup(blockerId, mechanism, items) {
  const key = `${blockerId}-${mechanism}`;
  const limit = state.expandedEnablerLimit[key] || 3;
  const shown = items.slice(0, limit);
  const cards = shown.map(e=>renderEnablerCard(blockerId,e)).join('');
  const more = items.length > limit ? `<button class="show-more" data-more-enablers="${key}">Show ${items.length-limit} more enabler${items.length-limit===1?'':'s'}</button>` : '';
  return `<section class="enabler-group"><div class="enabler-group-title" style="color:var(--${mechanism.toLowerCase()})">${mechanism}</div><div class="enabler-list">${cards}</div>${more}</section>`;
}
function renderEnablerCard(blockerId, e) {
  const openKey = `${blockerId}:${e.id}`;
  const open = state.openEnablers.has(openKey);
  const saved = state.bookmarks.enablers.includes(e.id);
  return `<article class="enabler-card">
    <button class="enabler-summary" data-toggle-enabler="${openKey}"><div><strong>${escapeHtml(e.title)}</strong><p>${escapeHtml(e.description)}</p></div><span class="chevron" style="transform:${open?'rotate(90deg)':'none'}">${icon('chevron')}</span></button>
    ${open ? `<div class="enabler-detail">
      <div class="detail-actions"><button class="save-btn ${saved?'saved':''}" data-save-enabler="${e.id}">${icon('bookmark')} ${saved?'Saved':'Save'}</button></div>
      <div class="enabler-detail-grid"><div class="mini-section"><b>Practical actions</b><p>${escapeHtml(e.practicalActions)}</p></div><div class="mini-section"><b>Expected outcome</b><p>${escapeHtml(e.expectedOutcome || '—')}</p></div></div>
      <div class="enabler-stakeholders"><b>Stakeholders:</b> ${escapeHtml(e.stakeholders.join(' · '))}</div>
      <button class="relevance-btn" data-relevance="${blockerId}:${e.id}">Why is this relevant?</button>
      <div class="rationale" data-rationale="${blockerId}:${e.id}" hidden>${escapeHtml(e.relationship.rationale)}</div>
    </div>`:''}
  </article>`;
}

function bindBlockerEvents() {
  app.querySelectorAll('[data-toggle-blocker]').forEach(btn => btn.onclick = () => {
    const id = Number(btn.dataset.toggleBlocker);
    state.openBlocker = state.openBlocker === id ? null : id;
    state.openEnablers.clear();
    rerenderCurrentExploreView();
    if (state.openBlocker) document.querySelector(`[data-blocker-card="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
  app.querySelectorAll('[data-toggle-enabler]').forEach(btn => btn.onclick = () => {
    const key = btn.dataset.toggleEnabler;
    state.openEnablers.has(key) ? state.openEnablers.delete(key) : state.openEnablers.add(key);
    rerenderCurrentExploreView();
  });
  app.querySelectorAll('[data-save-blocker]').forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    toggleBookmark('blockers', Number(btn.dataset.saveBlocker));
    rerenderCurrentExploreView();
  });
  app.querySelectorAll('[data-save-enabler]').forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    toggleBookmark('enablers', Number(btn.dataset.saveEnabler));
    rerenderCurrentExploreView();
  });
  app.querySelectorAll('[data-relevance]').forEach(btn => btn.onclick = () => {
    const el=app.querySelector(`[data-rationale="${btn.dataset.relevance}"]`);
    el.hidden=!el.hidden;
    btn.textContent=el.hidden?'Why is this relevant?':'Hide rationale';
  });
  app.querySelectorAll('[data-more-enablers]').forEach(btn => btn.onclick = () => {
    const key=btn.dataset.moreEnablers;
    state.expandedEnablerLimit[key]=999;
    rerenderCurrentExploreView();
  });
  app.querySelectorAll('[data-toggle-dependencies]').forEach(btn => btn.onclick = () => {
    const id=Number(btn.dataset.toggleDependencies);
    state.openDependencies.has(id) ? state.openDependencies.delete(id) : state.openDependencies.add(id);
    rerenderCurrentExploreView();
  });
  app.querySelectorAll('[data-dependency-blocker]').forEach(btn => btn.onclick = e => {
    e.stopPropagation();
    focusBlocker(Number(btn.dataset.dependencyBlocker));
  });
}

function toggleBookmark(type,id) {
  const arr = state.bookmarks[type];
  const idx = arr.indexOf(id);
  if (idx >= 0) { arr.splice(idx,1); toast('Removed from My Selection'); }
  else { arr.push(id); toast('Saved to My Selection'); }
  saveBookmarks();
}

function openSearch() {

    <div class="search-input-wrap">${icon('search')}<input id="searchInput" autocomplete="off" placeholder="Search the loaded knowledge base…"></div>
    <div class="search-tabs"><button class="search-tab active" data-search-type="all">All</button><button class="search-tab" data-search-type="blockers">Blockers</button><button class="search-tab" data-search-type="enablers">Enablers</button></div>
    <div id="searchResults"><div class="empty-state">Start typing to search.</div></div>
  </div></div>`;
  const input = document.getElementById('searchInput');

  modalRoot.querySelectorAll('[data-search-type]').forEach(b=>b.onclick=()=>{state.searchType=b.dataset.searchType; modalRoot.querySelectorAll('.search-tab').forEach(x=>x.classList.toggle('active',x===b)); updateSearch(input.value);});

function updateSearch(q) {
  const box=document.getElementById('searchResults');
  q=q.trim().toLowerCase();
  if(!q){box.innerHTML='<div class="empty-state">Start typing to search.</div>'; return;}
  const bs=state.data.blockers.filter(b=>[b.title,b.statement,b.whyItMatters].join(' ').toLowerCase().includes(q));
  const es=state.data.enablers.filter(e=>[e.title,e.description,e.practicalActions].join(' ').toLowerCase().includes(q));
  let html='';
  if((state.searchType==='all'||state.searchType==='blockers')&&bs.length) html+=`<section class="search-section"><h4>Blockers</h4>${bs.map(b=>`<div class="search-result" data-search-blocker="${b.id}"><strong>${escapeHtml(b.title)}</strong><span>${escapeHtml(truncate(b.statement,140))}</span></div>`).join('')}</section>`;
  if((state.searchType==='all'||state.searchType==='enablers')&&es.length) html+=`<section class="search-section"><h4>Enablers</h4>${es.map(e=>`<div class="search-result"><strong>${escapeHtml(e.title)}</strong><span>${escapeHtml(truncate(e.description,140))}</span></div>`).join('')}</section>`;
  box.innerHTML=html||'<div class="empty-state">No matching items.</div>';
  box.querySelectorAll('[data-search-blocker]').forEach(r=>r.onclick=()=>{const id=Number(r.dataset.searchBlocker); const b=state.data.blockers.find(x=>x.id===id); if(!b)return; closeModal(); location.hash=`#domain/${b.domain}`; setTimeout(()=>{state.openBlocker=id; renderDomain(); document.querySelector(`[data-blocker-card="${id}"]`)?.scrollIntoView({behavior:'smooth',block:'center'});},80);});
}

  return out;

function bindTimelineEvents() {
  app.querySelectorAll('[data-tl-gate]').forEach(btn=>btn.onclick=()=>{
    state.timelineGate=Number(btn.dataset.tlGate);
    state.timelineBlocker=null;
    state.timelineDetail=false;
    state.timelineMechanism=null;
    state.openEnablers.clear();
    renderTimeline();
  });
  app.querySelectorAll('[data-tl-blocker]').forEach(btn=>btn.onclick=()=>{
    const b=blockerById(Number(btn.dataset.tlBlocker));
    if(!b) return;
    state.timelineBlocker=b.id;
    state.timelineGate=b.stageGate;
    state.timelineDetail=false;
    state.timelineMechanism=null;
    state.openEnablers.clear();
    renderTimeline();
  });
  app.querySelectorAll('[data-tl-related]').forEach(btn=>btn.onclick=()=>{
    const b=blockerById(Number(btn.dataset.tlRelated));
    if(!b) return;
    state.timelineBlocker=b.id;
    state.timelineGate=b.stageGate;
    state.timelineDetail=false;
    state.timelineMechanism=null;
    state.openEnablers.clear();
    renderTimeline();
  });
  document.getElementById('tlZoomBlocker')?.addEventListener('click',()=>{
    state.timelineDetail=true;
    renderTimeline();
  });
  document.getElementById('tlBackToMap')?.addEventListener('click',()=>{
    state.timelineDetail=false;
    state.timelineMechanism=null;
    renderTimeline();
  });
  app.querySelectorAll('[data-tl-mechanism]').forEach(btn=>btn.onclick=()=>{
    state.timelineMechanism=btn.dataset.tlMechanism;
    state.openEnablers.clear();
    renderTimeline();
    setTimeout(()=>document.querySelector('.tl-enabler-zone')?.scrollIntoView({behavior:'smooth',block:'start'}),30);
  });
  app.querySelectorAll('[data-tl-enabler]').forEach(btn=>btn.onclick=()=>{
    const key=btn.dataset.tlEnabler;
    state.openEnablers.has(key)?state.openEnablers.delete(key):state.openEnablers.add(key);
    renderTimeline();
  });
  app.querySelectorAll('[data-tl-level]').forEach(btn=>btn.onclick=()=>{
    const level=btn.dataset.tlLevel;
    if(level==='root'){state.timelineGate=null;state.timelineBlocker=null;state.timelineDetail=false;state.timelineMechanism=null;}
    if(level==='gate'){state.timelineBlocker=null;state.timelineDetail=false;state.timelineMechanism=null;}
    if(level==='blocker'){state.timelineDetail=true;state.timelineMechanism=null;}
    state.openEnablers.clear();
    renderTimeline();
  });
}

function renderTimeline() {
  const body = !state.timelineGate

function companyAssessmentResultFromAnswers(answers) {
  const blockerStatuses = {};

}

  const answers={};

function assessmentMappedBlockers(q) {
  return q.blockerIds.map(id=>state.data.blockers.find(b=>b.id===id)).filter(Boolean);

function companyAssessmentGateSummary(result,gateId) {
  const blockers=state.data.blockers.filter(b=>b.stageGate===gateId);
  if(!blockers.length) return {kind:'empty',total:0,resolved:0,partial:0,open:0,remaining:0};
  let resolved=0,partial=0,open=0;
  blockers.forEach(b=>{
    const s=result.blockerStatuses[b.id] || 'open';
    if(s==='resolved')resolved++; else if(s==='partial')partial++; else open++;
  });
  const remaining=partial+open;
  return {kind:remaining===0?'done':'active',total:blockers.length,resolved,partial,open,remaining};
}

  if(trace){trace.setAttribute("aria-expanded","false");trace.setAttribute("aria-controls","traceBody");trace.addEventListener("click",function(){var body=document.getElementById("traceBody");trace.setAttribute("aria-expanded",body&&body.hidden?"false":"true");});}
  return result;
};
var uxRenderAssessmentResults=renderCompanyAssessmentResults;
renderCompanyAssessmentResults=function(result){
  try{localStorage.removeItem(UX_ASSESSMENT_DRAFT_KEY);}catch(e){}
  return uxRenderAssessmentResults(result);
};

window.addEventListener("storage",function(e){
  if(e.key==="aistExplorerBookmarks"){state.bookmarks=loadBookmarks();updateBookmarkCount();if(state.route==="selection")renderSelection();}
});

var uxRender=render;
render=function(){
  var result=uxRender();
  uxEnhanceView();
  return result;
};

var uxInit=init;
init=async function(){
  await uxInit();
  if(new URLSearchParams(location.search).get("search")==="1"){
    setTimeout(openSearch,0);
    var url=new URL(location.href);url.searchParams.delete("search");
    history.replaceState(null,"",url.pathname+(url.search||"")+url.hash);
  }
};


init().catch(err => {
  console.error(err);
  app.innerHTML = `<section class="page narrow"><div class="empty-state">Could not load the prototype data. Run the folder through a local web server rather than opening the HTML file directly.</div></section>`;
});

</script>
