<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#dceaf0"><title>Scale Run · The First Encounter</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,system-ui,Arial,sans-serif;color:#183744;background:#dce8ef}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.top{position:fixed;left:clamp(15px,3vw,42px);top:clamp(15px,3vw,32px);pointer-events:none}.brand{font-size:clamp(16px,2vw,24px);letter-spacing:.24em;font-weight:700;color:#2d5365}.sub{font-size:11px;letter-spacing:.25em;color:#698695;margin-top:7px}.hint{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#f5fafce9;box-shadow:0 12px 38px #46687925;border:1px solid #ffffffb9;border-radius:100px;padding:11px 20px;font-size:13px;white-space:nowrap;text-align:center}.action{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);border:1px solid #9ddbdc;background:#e9ffff;color:#205868;padding:12px 22px;border-radius:100px;font-weight:700;box-shadow:0 5px 20px #56999d30;cursor:pointer;display:none}.action.show{display:block}.panel{position:fixed;right:22px;top:50%;transform:translateY(-50%);width:min(365px,calc(100vw - 30px));max-height:78dvh;overflow:auto;background:#f8fbfbea;backdrop-filter:blur(16px);border:1px solid #fff;border-radius:18px;padding:22px;box-shadow:0 18px 55px #365b7240;display:none}.panel.show{display:block}.panel h2{font-size:20px;margin:8px 0 12px}.panel p{line-height:1.55;font-size:13px;color:#45616b}.panel small{letter-spacing:.15em;color:#b45c69;font-weight:700}.panel button{float:right;border:0;background:#dfeaed;border-radius:7px;padding:7px 10px;cursor:pointer}.touch{position:fixed;bottom:88px;left:20px;display:none;grid-template-columns:repeat(3,49px);gap:5px}.touch button{width:49px;height:49px;border:1px solid #fff9;border-radius:13px;background:#f9ffffc9;color:#376677;font-size:19px;touch-action:none}.touch .up{grid-column:2}.touch .left{grid-column:1;grid-row:2}.touch .down{grid-column:2;grid-row:2}.touch .right{grid-column:3;grid-row:2}@media(pointer:coarse){.touch{display:grid}.hint{bottom:20px;font-size:11px;padding:9px 13px}.action{bottom:165px}.panel{right:12px;top:12px;transform:none;max-height:65dvh;padding:16px}.brand{font-size:16px}}@media(max-width:650px){.hint{left:auto;right:12px;transform:none;max-width:53vw;white-space:normal}.top{top:16px;left:17px}.action{left:auto;right:18px;transform:none}}
</style></head><body><canvas id="scene"></canvas><div class="top"><div class="brand">SCALE RUN</div><div class="sub">THE FIRST ENCOUNTER · 01</div></div><button class="action" id="interact">✦ Inspect blocker</button><div class="hint" id="hint">Move Stewart with WASD / arrow keys or tap the path</div><div class="touch"><button class="up" data-k="ArrowUp">▲</button><button class="left" data-k="ArrowLeft">◀</button><button class="down" data-k="ArrowDown">▼</button><button class="right" data-k="ArrowRight">▶</button></div><aside class="panel" id="panel"><button id="close">✕</button><small>BLOCKER 01 · AIST</small><h2 id="title">Loading…</h2><p id="statement"></p><p><b>Why it matters</b><br><span id="why"></span></p><p><b>Consequences</b><br><span id="consequence"></span></p><p><b>Relevant enablers</b><br><span id="enablers"></span></p><p style="font-size:11px">Information sourced from the AIST Explorer. This encounter is a visual demonstration; no blocker is considered resolved.</p></aside>
<script>
const c=document.getElementById('scene'),g=c.getContext('2d'),hint=document.getElementById('hint'),action=document.getElementById('interact'),panel=document.getElementById('panel');let W,H,dpr,clock=0,keys={},target=null,opened=false,record=null,enablers=[],near=false;const hero={x:-2.65,y:.05},enemy={x:2.45,y:-.05};const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function project(x,y,z=0){const scale=Math.min(W/11.7,H/7.8,110),cx=W*.5,cy=H*.52;return {x:cx+(x-y)*scale*.84,y:cy+(x+y)*scale*.41-z*scale,scale}}
function polygon(points,fill,stroke,width=1){g.beginPath();points.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke()}}
function isoRect(x1,y1,x2,y2,z,fill,stroke){polygon([project(x1,y1,z),project(x2,y1,z),project(x2,y2,z),project(x1,y2,z)],fill,stroke)}
function line(points,color,width=1){g.beginPath();points.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.strokeStyle=color;g.lineWidth=width;g.stroke()}
function glow(x,y,r,color){let grad=g.createRadialGradient(x,y,0,x,y,r);grad.addColorStop(0,color);grad.addColorStop(1,'transparent');g.fillStyle=grad;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function background(){let grad=g.createLinearGradient(0,0,W,H);grad.addColorStop(0,'#f3f8fa');grad.addColorStop(.65,'#d5e5ee');grad.addColorStop(1,'#abc7d8');g.fillStyle=grad;g.fillRect(0,0,W,H);for(let i=0;i<23;i++){let x=(i*173+47)%W,y=(i*239+97)%H,h=25+(i*31)%135;g.fillStyle=i%2?'#c2d5df45':'#ffffff55';g.fillRect(x,y,12+(i%4)*11,h);glow(x,y,90,'#ffffff25')}}
function world(){const corners=[project(-3.8,-1.05,0),project(3.7,-1.05,0),project(3.7,1.05,0),project(-3.8,1.05,0)];const drop=corners.map(p=>({x:p.x,y:p.y+25}));polygon([corners[2],corners[3],drop[3],drop[2]],'#8ea9b7');polygon([corners[1],corners[2],drop[2],drop[1]],'#a2bdc8');polygon(corners,'#f1f4f1','#ffffff',2);
for(let x=-3.5;x<3.8;x+=.5){line([project(x,-1.05,.005),project(x,1.05,.005)],'#c4d2d425',.8)}for(let y=-1;y<1.1;y+=.5){line([project(-3.8,y,.005),project(3.7,y,.005)],'#c4d2d425',.8)}
isoRect(-3.5,-.26,3.45,.26,.013,'#e4ecea');line([project(-3.5,0,.02),project(3.45,0,.02)],'#a8d7d7',2);
for(const x of [-3.55,-1.4,.9,3.4])for(const y of [-.86,.86]){let p=project(x,y,.1);polygon([project(x-.09,y-.09,.1),project(x+.09,y-.09,.1),project(x+.09,y+.09,.1),project(x-.09,y+.09,.1)],'#b5cbd1');line([project(x,y,.1),project(x,y,.47)],'#a9c4ce',4);glow(project(x,y,.47).x,project(x,y,.47).y,24,'#9df8f57b')}
for(let x=-3.8;x<=3.8;x+=.5){let p=project(x,1.05,-.12);glow(p.x,p.y,12,'#8dece847')}
}
function shadow(x,y,r){let p=project(x,y);g.fillStyle='#3e667529';g.beginPath();g.ellipse(p.x,p.y+3,r,r*.4,0,0,7);g.fill()}
function stewart(){let p=project(hero.x,hero.y);let bob=Math.sin(clock*3.7)*2.5;shadow(hero.x,hero.y,19);g.save();g.translate(p.x,p.y-23+bob);glow(0,-38,70,'#f8c56b32');g.fillStyle='#b7792b';g.beginPath();g.roundRect(-14,2,28,22,10);g.fill();g.fillStyle='#efae37';g.beginPath();g.roundRect(-16,0,32,21,12);g.fill();g.fillStyle='#5b564b';g.fillRect(-16,7,32,5);g.fillStyle='#f8c253';g.beginPath();g.arc(0,-18,22,0,7);g.fill();g.fillStyle='#ffd977';g.beginPath();g.arc(-5,-24,14,0,7);g.fill();g.fillStyle='#fffdf2';g.beginPath();g.ellipse(-8,-19,4.2,5.8,0,0,7);g.ellipse(7,-19,4.2,5.8,0,0,7);g.fill();g.fillStyle='#6b4d29';g.beginPath();g.arc(-7,-19,1.8,0,7);g.arc(8,-19,1.8,0,7);g.fill();g.strokeStyle='#956c38';g.lineWidth=4;g.beginPath();g.moveTo(17,17);g.lineTo(25,-49);g.stroke();glow(25,-49,37,'#ffd166a0');g.fillStyle='#fff0ad';g.beginPath();g.arc(25,-49,8,0,7);g.fill();g.restore()}
function blocker(){let p=project(enemy.x,enemy.y);shadow(enemy.x,enemy.y,40);let pulse=.5+.5*Math.sin(clock*2);glow(p.x,p.y-50,115,near?'#f17b8c56':'#db9da944');g.save();g.translate(p.x,p.y-10);g.strokeStyle='#d86c79';g.lineWidth=2;g.beginPath();g.ellipse(0,2,45,16,0,0,7);g.stroke();for(let i=0;i<7;i++){let a=i*2.4+clock*.14,r=17+(i%3)*11,z=-40-(i%4)*13+Math.sin(clock+i)*4,x=Math.cos(a)*r,y=Math.sin(a)*r*.43;g.save();g.translate(x,y+z);g.rotate(.25+Math.sin(clock*.3+i)*.15);g.fillStyle=i%2?'#354e64':'#273c53';g.fillRect(-10,-10,20,20);g.strokeStyle='#ec7d8c';g.strokeRect(-10,-10,20,20);g.restore()}glow(0,-50,30,'#ff788d'+(near?'dd':'88'));g.fillStyle='#ef8b9b';g.beginPath();g.moveTo(0,-70);g.lineTo(17,-51);g.lineTo(0,-32);g.lineTo(-17,-51);g.closePath();g.fill();g.fillStyle='#fff0f0';g.font='bold 19px system-ui';g.textAlign='center';g.fillText('!',0,-44);g.restore();if(near){g.fillStyle='#34586a';g.font='600 13px system-ui';g.textAlign='center';g.fillText('BLOCKER 01',p.x,p.y-132)}}
function draw(){background();world();blocker();stewart();if(near){let p=project(enemy.x,enemy.y);glow(p.x,p.y-80,95,'#faadba29')}}
function step(t){let dt=Math.min((t-(step.prev||t))/1000,.04);step.prev=t;clock+=dt;let dx=Number(keys.ArrowRight||keys.d)-Number(keys.ArrowLeft||keys.a),dy=Number(keys.ArrowDown||keys.s)-Number(keys.ArrowUp||keys.w);if(target&&!dx&&!dy){dx=target.x-hero.x;dy=target.y-hero.y;if(Math.hypot(dx,dy)<.09)target=null}let len=Math.hypot(dx,dy);if(len>.001){hero.x=clamp(hero.x+dx/len*dt*1.85,-3.4,3.35);hero.y=clamp(hero.y+dy/len*dt*1.85,-.7,.7)}near=dist(hero,enemy)<1.35;action.classList.toggle('show',near&&!opened);if(near&&!opened)hint.textContent='A blocker has awakened. Inspect it to learn what stands in your way.';else if(!opened)hint.textContent='Move with WASD / arrows or tap the path';draw();requestAnimationFrame(step)}
document.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key]=true;if((e.key==='e'||e.key==='Enter')&&near)inspect()});document.addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)});
c.addEventListener('pointerdown',e=>{let s=Math.min(W/11.7,H/7.8,110),a=(e.clientX-W*.5)/(.84*s),b=(e.clientY-H*.52)/(.41*s);target={x:clamp((a+b)/2,-3.4,3.35),y:clamp((b-a)/2,-.7,.7)}});
function inspect(){opened=true;panel.classList.add('show');action.classList.remove('show');hint.textContent='Stewart has identified the blocker.'}action.onclick=inspect;document.getElementById('close').onclick=()=>{opened=false;panel.classList.remove('show')};
function esc(s){return String(s||'Not documented').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
fetch('../aist_roadmap_data.json').then(r=>{if(!r.ok)throw Error('Unable to load');return r.json()}).then(data=>{record=data.blockers[0];enablers=(record.enabler_ids||[]).map(id=>data.enablers.find(x=>x.enabler_id===id)).filter(Boolean);document.getElementById('title').textContent=record.blocker_title;document.getElementById('statement').textContent=record.blocker_statement;document.getElementById('why').textContent=record.why_it_matters;document.getElementById('consequence').textContent=record.consequence_if_not_addressed;document.getElementById('enablers').innerHTML=enablers.map(e=>'• '+esc(e.enabler_title)).join('<br>')}).catch(()=>{document.getElementById('title').textContent='AIST data unavailable';document.getElementById('statement').textContent='Please reload the page.'});requestAnimationFrame(step);
</script></body></html>
